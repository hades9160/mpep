<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · MPEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">AS</div>
        <div>
          <span class="name" style="font-family:var(--font-display);font-weight:700;color:var(--navy-900);">Aurion Solar</span>
          <small>Performance Evaluation Dashboard</small>
        </div>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" placeholder="you@aurionsolar.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="auth-toggle">
        Accounts are created by HR admin in Supabase. Contact your administrator if you don't have one yet.
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
