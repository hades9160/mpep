<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Aurion Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">AS</div>
        <div>
          <span class="name" style="font-family:var(--font-display);font-weight:700;color:var(--navy-900);">Aurion Solar</span>
          <small>Performance Evaluation Dashboard</small>
        </div>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" placeholder="you@aurionsolar.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="auth-toggle">
        Accounts are created by HR admin in Supabase. Contact your administrator if you don't have one yet.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('authError');
    const submitBtn = document.getElementById('submitBtn');

    // If already logged in, go straight to dashboard.
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'index.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorBox.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        return;
      }
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
